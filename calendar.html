<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario | Contigo</title>
  <link rel="icon" href="assets/images/logo-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles/main.css">
  <link rel="stylesheet" href="assets/styles/home.css">
  <link rel="stylesheet" href="assets/styles/procedures.css">
  <link rel="stylesheet" href="assets/styles/bills.css">
</head>
<body class="app-page">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="home.html">
        <img src="assets/images/logo-icon.png" alt="">
        <span>Contigo</span>
      </a>

      <nav class="app-nav" aria-label="Secciones de la app">
        <a class="app-nav-link" href="home.html">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
          <span>Inicio</span>
        </a>
        <a class="app-nav-link" href="procedures.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>
          <span>Mis trámites</span>
        </a>
        <a class="app-nav-link" href="assistant.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>
          <span>Ayuda</span>
        </a>
        <a class="app-nav-link" href="profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          <span>Perfil</span>
        </a>
      </nav>

      <button id="logout-button" class="btn btn-secondary logout-button" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main id="contenido" class="home-main">
    <div class="container calendar-container">
      <a class="btn-link back-to-list" href="bills.html">← Ver mis recibos</a>

      <div class="home-greeting">
        <h1>Calendario</h1>
        <p>Tus recibos por pagar, ordenados por fecha.</p>
      </div>

      <div class="view-switch" role="group" aria-label="Cómo ver el calendario">
        <button id="list-view-button" class="chip" type="button" aria-pressed="true">Lista</button>
        <button id="month-view-button" class="chip" type="button" aria-pressed="false">Mes</button>
      </div>

      <section id="list-view" aria-label="Vista de lista">
        <div class="field month-filter">
          <label class="field-label" for="month-select">Mostrar</label>
          <select id="month-select" class="field-input"></select>
        </div>
        <h2 id="list-count" class="section-title"></h2>
        <ul id="event-list" class="event-list"></ul>
      </section>

      <section id="month-view" aria-label="Vista por mes" hidden>
        <div class="card month-card">
          <div class="month-header">
            <button id="prev-month" class="icon-button" type="button" aria-label="Mes anterior"></button>
            <h2 id="month-title" aria-live="polite"></h2>
            <button id="next-month" class="icon-button" type="button" aria-label="Mes siguiente"></button>
          </div>
          <table class="month-grid">
            <thead><tr id="weekday-row"></tr></thead>
            <tbody id="month-body"></tbody>
          </table>
          <p class="month-legend"><span class="legend-dot" aria-hidden="true"></span> Día con vencimiento</p>
        </div>

        <div class="month-list-header">
          <h2 id="month-count" class="section-title"></h2>
          <button id="show-month" class="btn-link" type="button" hidden>Ver todo el mes</button>
        </div>
        <ul id="month-list" class="event-list"></ul>
      </section>

      <div id="calendar-empty" class="receipt-empty" hidden>
        <p>No tienes recibos por pagar con fecha de vencimiento. <a href="scan.html">Escanea un recibo</a> para agregarlo a tu calendario.</p>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/scripts/main.js"></script>
  <script src="assets/scripts/storage.js"></script>
  <script src="assets/scripts/forms.js"></script>
  <script src="assets/scripts/icons.js"></script>
  <script src="assets/scripts/dates.js"></script>
  <script src="assets/scripts/procedures-data.js"></script>
  <script src="assets/scripts/guide-support-data.js"></script>
  <script src="assets/scripts/bills-data.js"></script>
  <script src="assets/scripts/calendar.js"></script>
</body>
</html>
