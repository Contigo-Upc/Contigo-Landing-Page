<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente | Contigo</title>
  <link rel="icon" href="assets/images/logo-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles/main.css">
  <link rel="stylesheet" href="assets/styles/home.css">
  <link rel="stylesheet" href="assets/styles/procedures.css">
  <link rel="stylesheet" href="assets/styles/assistant.css">
</head>
<body class="app-page">
  <a class="skip-link" href="#question-input">Saltar a escribir tu pregunta</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="home.html">
        <img src="assets/images/logo-icon.png" alt="">
        <span>Contigo</span>
      </a>

      <nav class="app-nav" aria-label="Secciones de la app">
        <a class="app-nav-link" href="home.html">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
          <span>Inicio</span>
        </a>
        <a class="app-nav-link" href="procedures.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>
          <span>Mis trámites</span>
        </a>
        <a class="app-nav-link is-active" href="assistant.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>
          <span>Ayuda</span>
        </a>
        <a class="app-nav-link" href="profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          <span>Perfil</span>
        </a>
      </nav>

      <button id="logout-button" class="btn btn-secondary logout-button" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main id="contenido" class="assistant-main">
    <div class="container assistant-container">
      <div class="assistant-header">
        <button id="back-button" class="assistant-back" type="button" aria-label="Volver" hidden></button>
        <img src="assets/images/logo-icon.png" alt="" class="assistant-avatar">
        <div>
          <h1>Asistente Contigo</h1>
          <p class="assistant-online"><span class="online-dot" aria-hidden="true"></span>En línea</p>
        </div>
      </div>

      <p id="topic-chip" class="topic-chip" hidden></p>

      <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-label="Conversación con el asistente"></div>

      <div id="suggestions" class="suggestions" role="group" aria-label="Preguntas sugeridas"></div>

      <form id="chat-form" class="chat-form" novalidate>
        <label class="visually-hidden" for="question-input">Escribe tu pregunta</label>
        <input id="question-input" class="field-input" type="text" placeholder="Escribe tu pregunta..." autocomplete="off" maxlength="200">
        <button id="send-button" class="send-button" type="submit" aria-label="Enviar pregunta"></button>
      </form>

      <p class="assistant-note">Simulación: las respuestas están preparadas de antemano y no usan inteligencia artificial real.</p>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/scripts/main.js"></script>
  <script src="assets/scripts/storage.js"></script>
  <script src="assets/scripts/forms.js"></script>
  <script src="assets/scripts/icons.js"></script>
  <script src="assets/scripts/procedures-data.js"></script>
  <script src="assets/scripts/guide-support-data.js"></script>
  <script src="assets/scripts/bills-data.js"></script>
  <script src="assets/scripts/glossary.js"></script>
  <script src="assets/scripts/assistant-data.js"></script>
  <script src="assets/scripts/assistant.js"></script>
</body>
</html>
